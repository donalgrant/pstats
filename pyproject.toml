[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stats-cli"
version = "1.0.1"
description = "Column statistics for whitespace-delimited numeric data, from the command line"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David A. Imel" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "pandas>=2", "scipy>=1.10"]

[project.scripts]
stats = "stats_cli.cli:main"
findgen = "stats_cli.findgen:main"

[project.urls]
Repository = "https://github.com/donalgrant/stats-cli"
Changelog = "https://github.com/donalgrant/stats-cli/blob/main/CHANGELOG.md"
Issues = "https://github.com/donalgrant/stats-cli/issues"

[tool.hatch.build.targets.sdist]
exclude = [".github", ".gitignore"]

[tool.hatch.build.targets.wheel]
packages = ["src/stats_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]  # if/else blocks are often clearer than long ternaries
